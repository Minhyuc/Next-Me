server:
  port: ${LOGIN_SERVICE_PORT:8081}

spring:
  datasource:
    url: ${LOGIN_DB_URL:jdbc:mysql://localhost:3306/NMLoginData}
    username: ${LOGIN_DB_USERNAME:${DB_USERNAME:root}}
    password: ${LOGIN_DB_PASSWORD:${MYSQL_PASSWORD}}

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:minhyuckyun@gmail.com}
    password: ${GOOGLE_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com
        debug: true
    default-encoding: UTF-8
jwt:
  secret: ${CREATE_JWT}

services:
  user-service:
    url: ${USER_SERVICE_URL:http://localhost:8082}

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
