server:
  port: ${USER_SERVICE_PORT:8082}
  tomcat:
    max-http-form-post-size: 10MB
    max-swallow-size: 10MB

spring:
  datasource:
    url: ${USER_DB_URL:jdbc:mysql://localhost:3306/NMUserData}
    username: ${USER_DB_USERNAME:${DB_USERNAME:root}}
    password: ${USER_DB_PASSWORD:${MYSQL_PASSWORD}}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

jwt:
  secret: ${CREATE_JWT}

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

openai:
  api-key: ${OPENAI_API_KEY}
  model: ${OPENAI_MODEL:gpt-4o-mini}
  endpoint: ${OPENAI_CHAT_ENDPOINT:https://api.openai.com/v1/chat/completions}
