server:
  port: 8082
  tomcat:
    max-http-form-post-size: 10MB
    max-swallow-size: 10MB

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/NMUserData
    username: root
    password: ${MYSQL_PASSWORD}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

jwt:
  secret: ${CREATE_JWT}

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

openai:
  api-key: ${OPENAI_API_KEY}
  model: gpt-4o-mini
  endpoint: https://api.openai.com/v1/chat/completions