server:
  # Gateway가 캐릭터 조회 요청을 전달할 내부 포트
  port: ${CHARACTER_SERVICE_PORT:8086}

spring:
  application:
    name: character-service
  datasource:
    # 보유 캐릭터와 일일 루틴 보상 지급 이력을 저장하는 전용 MySQL 스키마
    url: ${CHARACTER_DB_URL:jdbc:mysql://localhost:3306/NMCharacterData}
    username: ${CHARACTER_DB_USERNAME:${DB_USERNAME:root}}
    password: ${CHARACTER_DB_PASSWORD:${MYSQL_PASSWORD}}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${CREATE_JWT}

character:
  # MVP 캐릭터 번호는 1부터 3까지 고정한다.
  catalog-size: 3
  # routine-service만 보상 지급 API를 호출할 수 있게 확인하는 내부 키다.
  internal-key: ${CHARACTER_INTERNAL_KEY:${CREATE_JWT}}

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
